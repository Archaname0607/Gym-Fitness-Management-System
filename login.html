<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GymPro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #111827;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* GymPro Logo */
        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo span {
            font-size: 42px;
            vertical-align: middle;
        }

        .logo h1 {
            display: inline-block;
            color: #2563eb;
            font-size: 38px;
            vertical-align: middle;
            margin-left: 8px;
        }

        .login-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        /* Demo Login */
        .demo-box {
            margin-top: 25px;
            padding: 22px;
            background: #f8fafc;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
            text-align: center;
        }

        .demo-box h3 {
            margin-bottom: 12px;
            font-size: 20px;
        }

        .demo-box p {
            margin: 7px 0;
            color: #6b7280;
            font-size: 17px;
        }

        .demo-box strong {
            color: #111827;
        }

        /* Register Section */
        .register-box {
            text-align: center;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e5e7eb;
        }

        .register-box p {
            color: #4b5563;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .register-btn {
            display: inline-block;
            padding: 11px 22px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .register-btn:hover {
            background: #2563eb;
            color: white;
        }

        /* Back Home */
        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-size: 17px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 28px 22px;
            }

            .logo h1 {
                font-size: 32px;
            }

            .logo span {
                font-size: 36px;
            }

            .login-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- GymPro Logo -->
        <div class="logo">
            <span>🏋️</span>
            <h1>GymPro</h1>
        </div>

        <h2 class="login-title">Admin Login</h2>

        <form onsubmit="login(event)">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="errorMessage" class="error">
                Invalid username or password.
            </p>

        </form>

        <!-- Demo Login -->
        <div class="demo-box">
            <h3>Demo Login</h3>
            <p>Username: <strong>admin</strong></p>
            <p>Password: <strong>admin123</strong></p>
        </div>

        <!-- Member Registration -->
        <div class="register-box">
            <p>New to the gym?</p>

            <a href="register.html" class="register-btn">
                Register as a Member
            </a>
        </div>

        <!-- Back to Home -->
        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");

            if (username === "admin" && password === "admin123") {
                window.location.href = "dashboard.html";
            } else {
                errorMessage.style.display = "block";
            }
        }
    </script>

</body>
</html>
